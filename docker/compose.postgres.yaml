name: bmwquiz-db

services:
  db:
    image: postgres:18-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: bmwquiz
      POSTGRES_USER: bmwquiz_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets: [admin_password, migrator_password, app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/01-init-postgres.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, bmwquiz_admin, -d, bmwquiz]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    depends_on:
      db:
        condition: service_healthy
    secrets: [migrator_password]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        password=$$(cat /run/secrets/migrator_password)
        case "$$password" in
          ''|*[!0123456789abcdef]*) exit 1 ;;
        esac
        test "$${#password}" -eq 64
        export DATABASE_MIGRATION_URL="postgresql://bmwquiz_migrator:$$password@db:5432/bmwquiz?sslmode=disable"
        exec node dist/storage/migrate.cli.js
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    internal: true

secrets:
  admin_password:
    file: ../.db-secrets/admin_password
  migrator_password:
    file: ../.db-secrets/migrator_password
  app_password:
    file: ../.db-secrets/app_password
