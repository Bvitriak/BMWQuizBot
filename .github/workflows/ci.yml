name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node 26.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm audit --audit-level moderate
      - run: sh -n docker/init-postgres.sh && docker compose --env-file /dev/null -f docker/compose.postgres.yaml --profile tools config --quiet
      - run: docker compose --env-file /dev/null -f docker/compose.yaml up --build --abort-on-container-exit --exit-code-from tests
      - if: always()
        run: docker compose --env-file /dev/null -f docker/compose.yaml down
